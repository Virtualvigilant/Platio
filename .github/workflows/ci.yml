name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Design tokens are generated from design-system/tokens.json
        run: npm run tokens:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Database and tenant-isolation tests
        run: npm run test:db
      - run: npm run build
